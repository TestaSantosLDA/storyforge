<!doctype html>
<html><head><meta charset="utf-8"><title>Os Lusíadas Ep.0</title>
<style>
:root{--navy:#0a0f24;--ink:#060914;--coral:#ff4d3d;--gold:#ffc83d;--cyan:#3de1ff;--cream:#f6efe2;--violet:#7b5cff;}
html,body{margin:0;background:#000;overflow:hidden}
#wrap{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--ink);transform-origin:0 0}
#stage{position:absolute;inset:0}
.abs{position:absolute;will-change:transform}
.full{left:0;top:0;width:1920px;height:1080px}
.h{font-family:'Inter Display','Inter',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;line-height:.9;color:var(--cream)}
.b{font-family:'Inter',sans-serif;font-weight:700;color:var(--cream);line-height:1.15}
.serif{font-family:'DejaVu Serif',serif;font-style:italic;color:var(--cream);line-height:1.2}
.mono{font-family:'DejaVu Sans Mono',monospace;color:var(--cyan);letter-spacing:.18em;text-transform:uppercase}
.tag{font-family:'DejaVu Sans Mono',monospace;font-size:26px;letter-spacing:.15em;text-transform:uppercase;padding:10px 22px;border:3px solid currentColor;border-radius:999px;white-space:nowrap}
.card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:26px 32px;backdrop-filter:none}
.center{left:0;width:1920px;text-align:center}
#grain{position:absolute;inset:-200px;opacity:.10;pointer-events:none;mix-blend-mode:overlay}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#bar{position:absolute;left:0;bottom:0;height:6px;background:var(--gold);width:0}
#bug{position:absolute;right:48px;top:40px;font-family:'DejaVu Sans Mono',monospace;font-size:20px;letter-spacing:.2em;color:rgba(246,239,226,.55)}
</style></head>
<body>
<div id="wrap"><div id="stage"></div>
<canvas id="grain" width="512" height="512"></canvas>
<div id="vignette"></div><div id="flash"></div><div id="bar"></div>
<div id="bug">OS LUSÍADAS · EP.00</div>
</div>
<script>
const W=1920,H=1080,DUR=510;
const stage=document.getElementById('stage');
const ALL=[],HOOKS=[];
let OFF=0; // scene time offset: blocks are written in local time; OFF places them on the master timeline
function HK(f){const o=OFF;HOOKS.push(t=>f(t-o));}
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c=1.9,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
  el:x=>x===0||x===1?x:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const DEF={x:0,y:0,s:1,r:0,o:1,b:0,cl:1,tc:1};
function mk(html,style={},parent=stage,cls=''){
  const d=document.createElement('div');d.className='abs '+cls;d.innerHTML=html;
  Object.assign(d.style,style);(parent.el||parent).appendChild(d);
  d._tw=[];d._disp=style.display||'';ALL.push(d);d.tw=(t0,dur,from,to,ease='out')=>{d._tw.push({t0:t0+OFF,t1:t0+OFF+dur,from,to,ease});return d};
  return d;}
function svg(inner,style={},parent=stage,vb='0 0 1920 1080'){
  return mk(`<svg viewBox="${vb}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`,style,parent);}
// typewriter element
function typed(text,style,parent,cls){const d=mk('',style,parent,cls);d._text=text;return d;}
function scene(s,e,bg){
  const c=mk('',{left:0,top:0,width:W+'px',height:H+'px',background:bg||'transparent'});
  c.tw(s,.45,{o:0},{o:1},'lin');c.tw(e-.45,.45,{},{o:0},'lin');c._s=s+OFF;c._e=e+OFF;c.el=c;return c;}
// text helper: x,y px; size px
function T(html,x,y,size,cls='h',ex={},parent){
  const st=Object.assign({left:x+'px',top:y+'px',fontSize:size+'px'},ex);return mk(html,st,parent,cls);}
function C(html,y,size,cls='h',ex={},parent){return T(html,0,y,size,cls+' center',ex,parent);}
// entrance shortcuts
const IN=(d,t,dy=60,dur=.7)=>d.tw(t,dur,{o:0,y:dy},{o:1,y:0},'out');
const POP=(d,t,dur=.6)=>d.tw(t,dur,{o:0,s:.4},{o:1,s:1},'back');
const OUT=(d,t,dur=.4)=>d.tw(t,dur,{},{o:0,y:-30},'in');
const WIPE=(d,t,dur=.8)=>d.tw(t,dur,{cl:0},{cl:1},'io');

function render(t){
  for(const d of ALL){
    const st={...DEF},touched={};
    for(const w of d._tw){
      if(t>=w.t0){
        const p=w.t1>w.t0?Math.min(1,(t-w.t0)/(w.t1-w.t0)):1,k=E[w.ease](p);
        for(const key in w.to){const a=(key in w.from)?w.from[key]:st[key];st[key]=a+(w.to[key]-a)*k;touched[key]=1;}
        for(const key in w.from){if(!(key in w.to)){st[key]=w.from[key];touched[key]=1;}}
      }else{for(const key in w.from){if(!touched[key]){st[key]=w.from[key];touched[key]=1;}}}
    }
    if(d._s!==undefined&&(t<d._s-.01||t>d._e+.01)){d.style.display='none';continue;}
    if(st.o<=0.002){d.style.display='none';continue;}
    d.style.display=d._disp;
    d.style.opacity=st.o;
    d.style.transform=`translate(${st.x}px,${st.y}px) rotate(${st.r}deg) scale(${st.s})`;
    d.style.filter=st.b>0.05?`blur(${st.b}px)`:'';
    if(st.cl<0.999)d.style.clipPath=`inset(-10% ${(1-st.cl)*110}% -10% -5%)`;else d.style.clipPath='';
    if(d._text!==undefined){const n=Math.round(d._text.length*st.tc);d.textContent=d._text.slice(0,n);}
  }
  for(const h of HOOKS)h(t);
  document.getElementById('bar').style.width=(t/DUR*100)+'%';
  // grain
  const g=document.getElementById('grain');const r=Math.floor(t*24)*7919;
  g.style.transform=`translate(${(r%173)-86}px,${(r%131)-65}px) scale(4)`;
}
// grain canvas
(()=>{const g=document.getElementById('grain'),c=g.getContext('2d'),im=c.createImageData(512,512);
 let s=12345;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}c.putImageData(im,0,0);})();
const flash=document.getElementById('flash');
const FLASHES=[];function FL(t,a=.9,d=.35){FLASHES.push([t+OFF,a,d]);}
HOOKS.push(t=>{let o=0;for(const[f,a,d]of FLASHES){if(t>=f&&t<f+d)o=Math.max(o,a*(1-(t-f)/d));}flash.style.opacity=o;});

// ---------- reusable: waves ----------
function waves(parent,s,e,color,base=820,amp=26,n=4,speed=1){
  const paths=[];let inner='';
  for(let i=0;i<n;i++)inner+=`<path id="" fill="${color}" opacity="${0.25+0.18*i}"/>`;
  const w=svg(inner,{left:0,top:0,width:W+'px',height:H+'px'},parent);
  const ps=w.querySelectorAll('path');
  HK(t=>{if(t<s||t>e)return;ps.forEach((p,i)=>{let d=`M0 ${H} `;const yb=base+i*55;
    for(let x=0;x<=W;x+=40){const y=yb+Math.sin(x/170+t*speed*(1.2+i*.35)+i)*amp+Math.sin(x/63-t*speed*2.1+i*2)*amp*.35;d+=`L${x} ${y.toFixed(1)} `;}
    p.setAttribute('d',d+`L${W} ${H} Z`);});});
  return w;}
function rain(parent,s,e,n=90){
  let inner='';for(let i=0;i<n;i++)inner+=`<line stroke="rgba(160,200,255,.35)" stroke-width="2"/>`;
  const w=svg(inner,{left:0,top:0,width:W+'px',height:H+'px'},parent);const ls=w.querySelectorAll('line');
  const seeds=[...ls].map((_,i)=>[(i*977)%W,(i*613)%H,700+(i*37)%500]);
  HK(t=>{if(t<s||t>e)return;ls.forEach((l,i)=>{const[x0,y0,v]=seeds[i];const y=(y0+t*v)%(H+120)-60;const x=(x0-t*v*.25)%W;const xx=x<0?x+W:x;
    l.setAttribute('x1',xx);l.setAttribute('y1',y);l.setAttribute('x2',xx-14);l.setAttribute('y2',y+55);});});
  return w;}
const SHIP=`<g><path d="M-170 0 L170 0 L120 70 L-130 70 Z" fill="#1a1f3a" stroke="#f6efe2" stroke-width="5"/>
<line x1="0" y1="0" x2="0" y2="-260" stroke="#f6efe2" stroke-width="7"/><line x1="-90" y1="-60" x2="-90" y2="-190" stroke="#f6efe2" stroke-width="5"/>
<path d="M8 -245 Q95 -170 8 -95 Z" fill="#f6efe2"/><path d="M-84 -180 Q-25 -130 -84 -75 Z" fill="#f6efe2"/>
<path d="M28 -210 h44 v44 h-44z" fill="none"/><path d="M40 -200 l22 0 M51 -211 l0 22" stroke="#ff4d3d" stroke-width="7"/></g>`;


// ---------- reusable: Camões avatar + speech bubbles (speaking scenes) ----------
const CAMOES_SVG=`<defs><clipPath id="cc"><circle cx="230" cy="230" r="210"/></clipPath></defs>
   <circle cx="230" cy="230" r="215" fill="#14103a" stroke="#ffc83d" stroke-width="8"/>
   <g clip-path="url(#cc)"><path d="M120 460 Q130 330 230 320 Q330 330 340 460Z" fill="#ff4d3d"/>
   <ellipse cx="230" cy="215" rx="88" ry="105" fill="#f6efe2"/>
   <path d="M150 230 Q160 330 230 345 Q300 330 310 230 Q300 300 230 310 Q160 300 150 230Z" fill="#c9a36a"/>
   <path d="M150 190 Q230 160 310 190" stroke="#0a0f24" stroke-width="10" fill="none"/>
   <ellipse cx="265" cy="205" rx="22" ry="16" fill="#0a0f24"/>
   <path d="M175 205 h40" stroke="#0a0f24" stroke-width="9" stroke-linecap="round"/>
   ${Array.from({length:9},(_,i)=>{const a=Math.PI*(1.05+i*.11);const x=230+Math.cos(a)*112,y=200+Math.sin(a)*112;return `<ellipse cx="${x}" cy="${y}" rx="26" ry="11" fill="#3fbf6a" transform="rotate(${a*180/Math.PI+90} ${x} ${y})"/>`}).join('')}
   </g>`;
function camoes(parent,x,y,size,t0,talk=[]){
  const a=svg(CAMOES_SVG,{left:x+'px',top:y+'px',width:size+'px',height:size+'px'},parent,'0 0 460 460');POP(a,t0,.7);
  HK(t=>{const on=talk.some(([s,e])=>t>=s&&t<e);a.firstChild.style.transform=`translateY(${Math.sin(t*(on?9:1.5))*(on?6:8)}px)`;});
  return a;}
function SAY(parent,text,x,y,w,t,col='#ffc83d',size=50,dur=null){
  const b=mk('',{left:x+'px',top:y+'px',width:w+'px',background:'rgba(255,255,255,.07)',border:`3px solid ${col}`,borderRadius:'34px 34px 34px 8px',padding:'26px 36px'},parent);
  b.tw(t,.45,{o:0,s:.7,y:30},{o:1,s:1,y:0},'back');
  const tx=typed(text,{position:'relative',fontSize:size+'px'},b,'b');tx.tw(t+.25,dur||Math.max(.6,text.length/34),{tc:0},{tc:1},'lin');
  return b;}

// =================== SCENE 1: cold open 0-18 ===================
{const s=scene(0,18.2,'radial-gradient(ellipse at 50% 30%,#141c3d,#05070f 70%)');
 rain(s,0,18.2);
 const shipWrap=svg(`<g id="sh" transform="translate(960 760)">${SHIP}</g>`,{left:0,top:0,width:W+'px',height:H+'px'},s);
 const sh=shipWrap.querySelector('#sh');
 HK(t=>{if(t>18.3)return;const sink=Math.max(0,(t-9))*30;const tilt=Math.sin(t*1.3)*6+Math.max(0,t-9)*3.2;
   sh.setAttribute('transform',`translate(960 ${760+sink+Math.sin(t*1.7)*12}) rotate(${tilt})`);});
 waves(s,0,18.3,'#0f3b6b',800,30,4,1.3);
 const loc=typed('Somewhere off the Mekong Delta',{left:'120px',top:'120px',fontSize:'30px'},s,'mono');loc.tw(1,1.8,{tc:0},{tc:1},'lin');
 const yr=T('c. 1559',120,180,250,'h',{color:'#f6efe2'},s);yr.tw(2.8,.9,{o:0,s:1.25,b:12},{o:1,s:1,b:0},'out');
 const l1=T('A ship is going down.',125,450,64,'serif',{},s);IN(l1,7.2);
 OUT(yr,12.5);OUT(l1,12.5);OUT(loc,12.5);
 const l2=C('Nobody on board knows<br>this night will save a masterpiece.',300,72,'b',{},s);IN(l2,13.3);
 FL(5.6,.7,.3);FL(6.1,.5,.25);FL(11.8,.8,.4);}

// =================== SCENE 2: grab 18-33 ===================
{const s=scene(18,33.4,'#05070f');
 const a=C('Everyone grabs what they can.',170,70,'b',{},s);IN(a,18.4);
 const items=[['Gold.',20.6],['Spices.',22.0],['Anything.',23.4]];
 items.forEach(([w,t],i)=>{const d=T(w,[230,760,1300][i],360,110,'h',{color:i==2?'#3de1ff':'#ffc83d',whiteSpace:'nowrap'},s);POP(d,t);
   const st=mk('',{left:([230,760,1300][i]-10)+'px',top:'400px',width:(d.offsetWidth+20)+'px',height:'14px',background:'#ff4d3d',transformOrigin:'0 50%'},s);
   st.tw(t+.8,.35,{o:0,cl:0},{o:1,cl:1},'out');});
 [a].forEach(d=>OUT(d,25.6));
 const b=C('One man swims with one arm…',600,64,'serif',{},s);IN(b,26.2);
 const c=C('…and holds a <span style="color:#ff4d3d">POEM</span><br>above the water.',720,120,'h',{},s);c.tw(28.6,.9,{o:0,s:.7,b:10},{o:1,s:1,b:0},'back');
 FL(28.6,.4,.3);}

// =================== SCENE 3: title 33-46.5 ===================
{const s=scene(33.2,46.6,'linear-gradient(160deg,#0a0f24 0%,#14103a 60%,#2a0f2f 100%)');
 const stripes=svg(Array.from({length:14},(_,i)=>`<rect x="${-400+i*190}" y="-200" width="60" height="1600" fill="rgba(255,200,61,.05)" transform="rotate(20 960 540)"/>`).join(''),{left:0,top:0,width:W+'px',height:H+'px'},s);
 HK(t=>{if(t<33||t>47)return;stripes.style.transform=`translateX(${(t-33)*30}px)`;});
 const tg=C('<span class="tag" style="color:#3de1ff">EP.00 — The Poet Who Swam</span>',230,26,'mono',{color:'#3de1ff'},s);POP(tg,33.8);
 const word='OS LUSÍADAS';const row=mk('',{left:'0',top:'380px',width:W+'px',textAlign:'center'},s);
 [...word].forEach((ch,i)=>{const sp=mk(ch===' '?'&nbsp;':ch,{position:'relative',display:'inline-block',fontSize:'230px',color:'#ffc83d'},row,'h');sp.style.position='relative';sp.tw(34.2+i*.07,.7,{o:0,y:120,r:-12},{o:1,y:0,r:0},'back');});
 const ul=mk('',{left:'560px',top:'640px',width:'800px',height:'10px',background:'#ff4d3d'},s);WIPE(ul,35.4,.6);
 const sub=C('The epic poem that made Portugal — remixed for 2026',690,44,'b',{color:'#f6efe2'},s);IN(sub,35.8);
 const fine=C('Luís Vaz de Camões · 1572 · 10 cantos',800,26,'mono',{color:'rgba(246,239,226,.6)'},s);IN(fine,36.6);
 waves(s,33,47,'#3de1ff',990,14,3,1);
 FL(34.1,.85,.4);}

// =================== SCENE 4: meet Camões 46-76 ===================
{const s=scene(46.2,76.4,'#0a0f24');
 const m=T('Meet',120,110,44,'mono',{color:'#3de1ff'},s);IN(m,46.6,30);
 const n1=T('Luís Vaz',115,170,170,'h',{},s);IN(n1,47);
 const n2=T('de Camões',115,320,170,'h',{color:'#ffc83d'},s);IN(n2,47.4);
 const tl=T('The guy who wrote Portugal’s national epic.<br>Also: a total disaster magnet.',120,520,40,'b',{color:'rgba(246,239,226,.85)',width:'900px'},s);IN(tl,49);
 // avatar
 const av=svg(`<defs><clipPath id="cc"><circle cx="230" cy="230" r="210"/></clipPath></defs>
   <circle cx="230" cy="230" r="215" fill="#14103a" stroke="#ffc83d" stroke-width="8"/>
   <g clip-path="url(#cc)"><path d="M120 460 Q130 330 230 320 Q330 330 340 460Z" fill="#ff4d3d"/>
   <ellipse cx="230" cy="215" rx="88" ry="105" fill="#f6efe2"/>
   <path d="M150 230 Q160 330 230 345 Q300 330 310 230 Q300 300 230 310 Q160 300 150 230Z" fill="#c9a36a"/>
   <path d="M150 190 Q230 160 310 190" stroke="#0a0f24" stroke-width="10" fill="none"/>
   <ellipse cx="265" cy="205" rx="22" ry="16" fill="#0a0f24"/>
   <path d="M175 205 h40" stroke="#0a0f24" stroke-width="9" stroke-linecap="round"/>
   ${Array.from({length:9},(_,i)=>{const a=Math.PI*(1.05+i*.11);const x=230+Math.cos(a)*112,y=200+Math.sin(a)*112;return `<ellipse cx="${x}" cy="${y}" rx="26" ry="11" fill="#3fbf6a" transform="rotate(${a*180/Math.PI+90} ${x} ${y})"/>`}).join('')}
   </g>`,{left:'1340px',top:'90px',width:'460px',height:'460px'},s,'0 0 460 460');
 POP(av,48.2,.8);
 HK(t=>{if(t<46||t>77)return;av.firstChild.style.transform=`translateY(${Math.sin(t*1.5)*8}px)`;});
 const rows=[['Born','c. 1524–25 · probably Lisbon'],['Class','Minor nobility (aka: broke)'],['Skills','Poetry · Sword · Trouble'],['Weakness','Falling for the wrong people']];
 rows.forEach(([k,v],i)=>{const cd=mk(`<span class="mono" style="font-size:22px;color:#3de1ff">${k}</span><div class="b" style="font-size:38px;margin-top:6px">${v}</div>`,{left:(120+(i%2)*840)+'px',top:(680+Math.floor(i/2)*170)+'px',width:'720px'},s,'card');
   cd.tw(53+i*2.2,.6,{o:0,x:-80},{o:1,x:0},'out');});
 const hp=T('HP ▮▮▮▮▮▯▯▯',1380,580,30,'mono',{color:'#ff4d3d'},s);IN(hp,63,20);
 const note=T('*Character stats unofficial. Vibes accurate.',120,1020,20,'mono',{color:'rgba(246,239,226,.45)',whiteSpace:'nowrap'},s);IN(note,66,10);}

// =================== NEW A: why Africa? (legend) local 76-102 ===================
{const s=scene(76,102.4,'linear-gradient(180deg,#1a0f2f,#0a0f24)');
 const tg=T('<span class="tag" style="color:#ffc83d">Fact or Legend?</span>',120,110,26,'mono',{color:'#ffc83d'},s);POP(tg,76.4);
 const a=T('Why does a young poet<br>end up a soldier in Africa?',120,200,84,'h',{},s);IN(a,77);
 const b=T('The romantic version:',125,470,44,'mono',{color:'#3de1ff',letterSpacing:'.06em'},s);IN(b,80.2,20);
 const c=T('He falls for a lady at court — Catarina de Ataíde —<br>and gets banished for it.',125,540,52,'serif',{},s);IN(c,82);
 const heart=svg(`<path d="M150 260 L40 150 Q-10 90 40 45 Q95 5 150 70 Q205 5 260 45 Q310 90 260 150 Z" fill="#ff4d3d"/><path id="crk" d="M150 70 L130 120 L165 150 L135 200 L150 260" stroke="#0a0f24" stroke-width="12" fill="none" stroke-linejoin="round"/>`,{left:'1500px',top:'330px',width:'300px',height:'280px'},s,'0 0 300 280');
 POP(heart,83.5);const crk=heart.querySelector('#crk');HK(t=>{if(t<76||t>103)return;crk.style.opacity=t>86.5?1:0;heart.firstChild.style.transform=`scale(${1+0.06*Math.max(0,Math.sin(t*7))})`;heart.firstChild.style.transformOrigin='50% 50%';});
 const st=T('LEGEND',1180,700,150,'h',{color:'#ff4d3d',border:'12px solid #ff4d3d',padding:'6px 34px',borderRadius:'22px',whiteSpace:'nowrap'},s);st.tw(88.2,.35,{o:0,s:2.4,r:-30},{o:1,s:1,r:-12},'out');FL(88.2,.55,.28);
 [a,b,c,heart,st].forEach(d=>OUT(d,91.2));
 const d=T('What we can document:',125,230,44,'mono',{color:'#3de1ff',letterSpacing:'.06em'},s);IN(d,92,20);
 const e=T('He served as a soldier in Ceuta<br>in the late 1540s.',115,300,96,'h',{color:'#ffc83d'},s);IN(e,93.2);
 const f=T('Why he went? Nobody knows for sure.<br>Plenty of broke young nobles did the same.',125,560,48,'b',{color:'rgba(246,239,226,.85)'},s);IN(f,96.8);}
OFF=26;
// =================== SCENE 5: Ceuta 76-100 ===================
{const s=scene(76,100.4,'linear-gradient(180deg,#2a0f14,#0a0f24)');
 const tg=T('<span class="tag" style="color:#ffc83d">Chapter 1 · Ceuta</span>',120,110,26,'mono',{color:'#ffc83d'},s);POP(tg,76.4);
 const a=T('North Africa,<br>late 1540s.',120,200,120,'h',{},s);IN(a,77);
 const b=T('Camões signs up as a soldier<br>in Portugal’s fortress at Ceuta.',125,470,46,'b',{color:'rgba(246,239,226,.85)'},s);IN(b,79.5);
 const eye=svg(`<path d="M30 150 Q210 0 390 150 Q210 300 30 150Z" fill="#f6efe2"/><circle cx="210" cy="150" r="70" fill="#3de1ff"/><circle cx="210" cy="150" r="32" fill="#0a0f24"/><circle cx="232" cy="128" r="12" fill="#fff"/>`,
