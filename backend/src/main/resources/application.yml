server:
  servlet.session.tracking-modes: cookie
  tomcat.max-swallow-size: -1

spring:
  application.name: storyforge
  servlet.multipart:
    # Clips from a video: uploads are full-length videos, written to disk as they arrive.
    max-file-size: 20GB
    max-request-size: 20GB
  datasource:
    url: ${STORYFORGE_DB_URL:jdbc:postgresql://localhost:5432/storyforge}
    username: ${STORYFORGE_DB_USER:storyforge}
    password: ${STORYFORGE_DB_PASSWORD:storyforge}
  # Branches built in parallel reserve migration numbers (clips V12, story format V13, series V14) and may merge in
  # any order; out-of-order lets a lower number that lands later still apply to an existing database.
  flyway.out-of-order: true
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate

storyforge:
  paths:
    # Generated audio, images and video: outside the repo.
    assets: ${STORYFORGE_ASSETS_DIR:${user.home}/storyforge-assets}
    # Character files and prompt templates are versioned in the repo (paths relative to backend/).
    characters: ${STORYFORGE_CHARACTERS_DIR:../characters}
    prompts: ${STORYFORGE_PROMPTS_DIR:../prompts}
    # Channel pronunciation dictionary (what the voice engine reads, never the script).
    pronunciation: ${STORYFORGE_PRONUNCIATION_FILE:../channel/pronunciation.yaml}
    # Pipeline D video profiles (one YAML per profile, versioned in the repo).
    profiles: ${STORYFORGE_PROFILES_DIR:../channel/video-profiles}
    # Public-domain source texts and series files (route map), versioned in the repo.
    sources: ${STORYFORGE_SOURCES_DIR:../sources}
    series: ${STORYFORGE_SERIES_DIR:../series}
  pipeline:
    max-concurrent-stories: 1
    story-cost-budget-usd: 10.00
  made-for-kids: false
  profiles:
    vertical-max-seconds: 58
    landscape-min-seconds: 480
    # A real person may be drawn, by kit code only, if they died before this year (docs/series/lusiadas.md C3).
    historical-died-before: 1900
    # Refused in look notes and profile text (CLAUDE.md licensing rules). Case-insensitive, whole words.
    banned-names:
      - Disney
      - Pixar
      - DreamWorks
      - Studio Ghibli
      - Ghibli
      - Marvel
      - DC Comics
      - Warner Bros
      - Looney Tunes
      - Nickelodeon
      - Cartoon Network
      - Illumination
      - Minions
      - Aardman
      - Nintendo
      - Pokémon
      - Pokemon
      - Sanrio
      - Hello Kitty
      - Peppa Pig
      - Bluey
      - Mickey Mouse
      - Kurzgesagt
